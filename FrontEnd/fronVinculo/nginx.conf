server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mismo papel que el proxy de Vite en desarrollo: el navegador solo habla con nginx.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Los JS y CSS llevan un hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html siempre se revalida, para que la ventana de escritorio coja la versión nueva
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
